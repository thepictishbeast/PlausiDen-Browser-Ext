<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlausiDen</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">PlausiDen</h1>
      <span class="version">v0.1.0</span>
    </header>

    <div class="status-bar" id="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Loading...</span>
    </div>

    <div class="stats">
      <div class="stat-row">
        <span class="stat-label">Profile</span>
        <span class="stat-value" id="profile-name">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Today</span>
        <span class="stat-value" id="entries-today">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Sessions</span>
        <span class="stat-value" id="sessions-today">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">All time</span>
        <span class="stat-value" id="total-entries">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Next run</span>
        <span class="stat-value" id="next-run">--</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="toggle-btn">Enable</button>
      <button class="btn btn-secondary" id="generate-btn">Generate Now</button>
    </div>

    <div class="feedback" id="feedback" hidden></div>

    <footer class="footer">
      <a href="#" id="options-link">Settings</a>
      <span class="tier-badge">Tier 0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
