[package]
name = "plausiden-wasm-engine"
version = "0.1.0"
edition = "2021"
description = "WASM bridge for plausiden-engine -- generates plausible browsing artifacts"
license = "BSL-1.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Property-based testing for regression invariants (no synthetic TLDs,
# URL validity, etc.). Native-only — never in the WASM build.
proptest = "1"

[profile.release]
opt-level = "s"
lto = true
