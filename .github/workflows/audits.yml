name: audits

# Audit-on-PR per v1.2 §A audit framework. Catches regressions that
# are invisible to typecheck / lint — synthetic-TLD leaks, manifest
# permission-scope creep, and wasm-engine test-suite drift.
#
# Authored: Claude 3, 2026-04-17 (task #34 close-out).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  manifest-permission-allowlist:
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      # jq is pre-provisioned on the self-hosted runner; relying on
      # apt-get update was flaking on stale mirrors. AVP-PASS: 2026-04-27
      # — removed install step to drop the fragile apt path.
      - name: Check manifest permission allowlist
        run: |
          # Inline permission allowlist check — the authoritative list
          # is {history, cookies, storage, alarms}. Any new permission
          # must be added here AND justified in OPSEC.md §4.
          set -e
          ALLOW='^(history|cookies|storage|alarms)$'
          DENY='^(host_permissions|webRequest|tabs|activeTab|declarativeNetRequest|proxy|scripting)$'
          for manifest in manifests/chrome/manifest.json manifests/firefox/manifest.json; do
            echo "== checking $manifest =="
            perms=$(jq -r '.permissions[]?' "$manifest" 2>/dev/null)
            for p in $perms; do
              if ! echo "$p" | grep -qE "$ALLOW"; then
                echo "::error::$manifest declares permission '$p' not in allowlist {history,cookies,storage,alarms}"
                exit 1
              fi
            done
            # Denied keys should not appear at all
            for k in host_permissions optional_host_permissions; do
              val=$(jq -r ".${k}? | length" "$manifest" 2>/dev/null)
              if [ "$val" != "null" ] && [ "$val" != "0" ]; then
                echo "::error::$manifest declares $k ($val entries) — deny"
                exit 1
              fi
            done
          done
          echo "allowlist: clean"

  wasm-engine-tests:
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-engine/target
          key: ${{ runner.os }}-cargo-wasm-engine-${{ hashFiles('wasm-engine/Cargo.lock', 'wasm-engine/Cargo.toml') }}
      - name: cargo test (wasm-engine)
        working-directory: wasm-engine
        run: cargo test --all-targets --quiet
      - name: cargo check wasm32 target
        working-directory: wasm-engine
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown

  leak-audit:
    runs-on: [self-hosted, linux, x64, plausiden]
    steps:
      - uses: actions/checkout@v4
      # ripgrep is pre-provisioned on the self-hosted runner; apt step was
      # flaking on mirror staleness. AVP-PASS: 2026-04-27 — removed step.
      - name: Run leak audit
        run: |
          # Shipped audit runner from sibling infra. In CI we vendor a
          # minimal copy to avoid needing a sibling checkout; the script
          # is under ~200 lines. If the shipped runner lives at the
          # repo root via submodule or copied folder, this step
          # invokes it. For now, inline the core check:
          echo "== Browser-Ext synthetic-TLD leak check =="
          if rg -l --glob '!target' --glob '!node_modules' --glob '!tests/' --glob '!*.md' --glob '!*.lock' \
            '\.(example|invalid|localhost|test)(/|"|'\''|$)|example\.(com|org|net)' \
            . > /tmp/leak-findings.txt 2>/dev/null; then
            # Filter out: doc comments (///, //!, //, #), assert lines
            # (unit-test allowlisting), AND lines bearing the
            # `LEAK-JUSTIFIED:` annotation (designed-exception sites
            # like BANNED_TLDS filter lists + the RFC 6761 self-check
            # probe host). Keep in sync with
            # scripts/audit/filter-cfg-test.py behaviour.
            real_hits=$(xargs rg -n '\.(example|invalid|localhost|test)(/|"|'\''|$)' < /tmp/leak-findings.txt 2>/dev/null | \
              grep -v '^\s*///\|^\s*//!\|^\s*//\|assert\|#[[:space:]]\|LEAK-JUSTIFIED:' | \
              wc -l || true)
            if [ "$real_hits" -gt 0 ]; then
              echo "::error::Synthetic-TLD leak in real code — $real_hits hit(s)"
              xargs rg -n '\.(example|invalid|localhost|test)(/|"|'\''|$)' < /tmp/leak-findings.txt | \
                grep -v 'LEAK-JUSTIFIED:' | head -20 || true
              exit 1
            fi
          fi
          echo "leak audit: clean"
